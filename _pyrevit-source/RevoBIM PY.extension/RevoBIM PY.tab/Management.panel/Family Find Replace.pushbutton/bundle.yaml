title: Family Find & Replace
author: RevoBIM
min_revit_version: 2024
tooltip: >-
  Swap one loadable family for another across the model.

  Find the original by category, family and type, or pick the elements
  straight out of the model. Choose which instance parameters travel with
  the swap. Each replacement lands on the original's insertion point and
  reads the same way round, and electrical circuits are carried across
  before the original is deleted.

  Orientation and height are set afterwards, on the whole set at once.
