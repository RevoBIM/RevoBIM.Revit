title: BWIC Penetration
tooltip: >
  Opens the RevoBIM BWIC Penetration window, with Wall, Slab and Global
  Placement tabs.

  Wall (rectangular or circular): select the services, press Return, then pick
  the wall in the linked model. Slab (rectangular, circular or automatic):
  select the services, press Return, then click the floor. Each tab opens on
  its family, with its preview and Family settings.
  Global Placement: sweeps the active view and places a BWIC around every
  group of pipes and cable trays passing through a fire rated or blockwork
  wall in the chosen link. The settings behind the gear hold clearances, rules
  and the workset; Global Placement uses the Wall tab's family. Escape
  returns to the window, which stays open while you navigate. A prompt at the
  top of the Revit window says what to pick next at each step.
author: RevoBIM PY
