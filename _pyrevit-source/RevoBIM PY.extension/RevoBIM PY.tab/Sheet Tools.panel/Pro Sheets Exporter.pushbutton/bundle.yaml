title: |-
  Pro Sheets
  Exporter
tooltip: >-
  RevoBIM Pro Sheets Exporter. Batch export sheets and views to PDF and DWG
  with custom file naming built from sheet parameters, output folders driven
  by project parameters, and export templates saved per project.

  Opens modeless, so Revit stays usable while it is open. Sheets selected
  before launching arrive already isolated on the first page.
author: RevoBIM PY
highlight: new
